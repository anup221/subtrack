spring:
  application:
    name: subtrack
  profiles:
    # Runs application-local.yml on developer machines. Production must set
    # SPRING_PROFILES_ACTIVE=prod and supplies all secrets as environment vars.
    default: local

  datasource:
    url: jdbc:postgresql://localhost:5432/subtrack
    username: subtrack
    password: subtrack

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  # --------------------------------------------------
  # Google OAuth2
  # --------------------------------------------------

  security:
    oauth2:
      client:
        registration:

          # Organization / Owner Google login
          google-org:
            client-id: "${GOOGLE_ORG_CLIENT_ID}"
            client-secret: "${GOOGLE_ORG_CLIENT_SECRET}"
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google-org"
            provider: google-org

          # Platform Admin Google login
          google-admin:
            client-id: "${GOOGLE_ADMIN_CLIENT_ID:${GOOGLE_ORG_CLIENT_ID}}"
            client-secret: "${GOOGLE_ADMIN_CLIENT_SECRET:${GOOGLE_ORG_CLIENT_SECRET}}"
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google-admin"
            provider: google-admin

        provider:

          # Google provider for organization users
          google-org:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email

          # Google provider for platform admins
          google-admin:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email

app:
  frontend-url: "${FRONTEND_URL:http://localhost:5173}"


# --------------------------------------------------
# JWT
# --------------------------------------------------

jwt:
  secret: "${JWT_SECRET}"
  expiration-ms: 86400000


# --------------------------------------------------
# Platform Admin
# --------------------------------------------------

admin:
  bootstrap-code: "${ADMIN_BOOTSTRAP_CODE:change-this-to-something-only-you-know}"


# --------------------------------------------------
# Webhooks
# --------------------------------------------------

webhook:
  secret: "${WEBHOOK_SECRET}"


# --------------------------------------------------
# Razorpay
# --------------------------------------------------

razorpay:
  key-id: "${RAZORPAY_KEY_ID}"
  key-secret: "${RAZORPAY_KEY_SECRET}"
  webhook-secret: "${RAZORPAY_WEBHOOK_SECRET:not-set-up-yet}"


# --------------------------------------------------
# Server
# --------------------------------------------------

server:
  port: 8080
